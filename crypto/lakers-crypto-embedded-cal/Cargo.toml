[package]
name = "lakers-crypto-embedded-cal"
version.workspace = true
edition = "2021"
license.workspace = true
description = "LAKE crypto library backend based on the embedded-cal crypto abstraction layer"
repository.workspace = true
readme.workspace = true

[dependencies]
lakers-shared.workspace = true
embedded-cal.workspace = true
rand_core = { version = "0.10", default-features = false }
digest = { version = "0.10", default-features = false }

[dev-dependencies]
embedded-cal-rustcrypto = { workspace = true, features = ["standalone"] }
hmac = { version = "0.12", default-features = false }
hexlit = "0.5.5"
