[package]
name = "lakers-crypto"
version.workspace = true
edition = "2021"
authors = ["Mališa Vučinić <malisa.vucinic@inria.fr>"]
license.workspace = true
description = "LAKE crypto library dispatch crate for development and testing"
repository.workspace = true
readme.workspace = true

[dependencies]
cfg-if = { version = "1.0", default-features = false }
lakers-shared = { package = "lakers-shared", path = "../shared", default-features = false }

lakers-crypto-embedded-cal = { workspace = true, optional = true }
embedded-cal = { workspace = true, optional = true }
rand_core = { version = "0.10", optional = true, default-features = false }

# software implementations from rustcrypto
embedded-cal-rand = { workspace = true, optional = true }
embedded-cal-rustcrypto = { workspace = true, optional = true }
getrandom = { version = "0.4.3", optional = true, default-features = false, features = ["sys_rng"] }

embedded-cal-software-demo = { workspace = true, optional = true }
embedded-cal-nrf54l15 = { workspace = true, optional = true }
embedded-cal-stm32wba55 = { workspace = true, optional = true }

# cryptocell for nrf52840 and nrf5340
embedded-cal-cryptocell = { workspace = true, optional = true }

[dev-dependencies]
hexlit = "0.5.3"
rstest = "0.11.0"

[features]
default = [  ]
cryptocell310 = [ "_cryptocell", "embedded-cal-cryptocell/nrf52840" ]
cryptocell312 = [ "_cryptocell", "embedded-cal-cryptocell/nrf5340" ]
# deprecated names
nrf5340 = [ "cryptocell312" ]
nrf54l15 = [ "cracen" ]
_cryptocell = [ "lakers-crypto-embedded-cal", "embedded-cal-software-demo" ]
# This requires std because we need to conjure randomness from thin air;
# embedded systems can still use embedded-cal-rustcrypto, but need to combine it
# with an entropy choice of their avail.
rustcrypto = [ "lakers-crypto-embedded-cal", "embedded-cal", "embedded-cal-rand", "embedded-cal-rustcrypto", "getrandom", "rand_core" ]

cracen = [ "lakers-crypto-embedded-cal", "embedded-cal-software-demo", "embedded-cal-nrf54l15" ]
stm32wba55 = [ "lakers-crypto-embedded-cal", "embedded-cal-software-demo", "embedded-cal-stm32wba55" ]
