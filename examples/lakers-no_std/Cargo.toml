[package]
name = "lakers-no_std"
authors = ["Kaspar Schleiser <kaspar@schleiser.de>"]
version = "0.1.0"
edition = "2021"

[dependencies]
lakers = { package = "lakers", path = "../../lib", features = [ "defmt" ] }
lakers-ead-authz = { path = "../../ead/lakers-ead-authz", optional = true }
lakers-crypto = { path = "../../crypto", default-features = false, optional = true }
lakers-crypto-embedded-cal = { workspace = true, optional = true }
embedded-cal = { workspace = true, optional = true }
embedded-cal-rand = { workspace = true, optional = true }
embedded-cal-rustcrypto = { workspace = true, optional = true }
rand_core = { version = "0.10", default-features = false, optional = true }
hexlit = "0.5.3"

# depend on an allocator
embedded-alloc = "0.5.0"

# cortex-m specifics
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"]}
cortex-m-rt = "0.7.2"
cortex-m-semihosting = "0.5.0"
panic-semihosting = { version = "0.6.0", features = ["exit"] }

defmt = "0.3"
defmt-rtt = "0.4"

[features]
default = [ "rtt", "crypto-cryptocell310", "ead-none" ]
rtt = [ ]
crypto-software-test-rng = [ "lakers-crypto-embedded-cal", "embedded-cal", "embedded-cal-rand", "embedded-cal-rustcrypto", "rand_core" ]
crypto-psa = [ "lakers-crypto/psa-baremetal" ]
crypto-cryptocell310 = [ "lakers-crypto/cryptocell310" ]
ead-none = [ ]
ead-authz = [ "lakers-ead-authz" ]
